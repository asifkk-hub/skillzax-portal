n:0;font-size:14px}.panel-head p{margin:4px 0 0;font-size:11px;color:var(--muted)}.panel-body{padding:18px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:left;background:#f8faff;color:#7a8799;font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:12px 15px;border-bottom:1px solid var(--line)}td{padding:13px 15px;border-bottom:1px solid #edf0f5;font-size:12px}tr:last-child td{border-bottom:0}.campaign-name{font-weight:750;font-size:12px}.muted{color:var(--muted)}.tag{display:inline-flex;padding:4px 8px;border-radius:99px;background:#edf3ff;color:#2c5eb6;font-size:10px;font-weight:750}.tag.green{background:#e5f7ef;color:#117b57}.tag.gray{background:#eef1f5;color:#657184}.tag.yellow{background:#fff6d8;color:#8b6810}.tag.red{background:#ffebed;color:#b42d3b}.empty{text-align:center;padding:34px 15px;color:var(--muted)}.empty b{display:block;color:#3c4b60;margin-bottom:5px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{padding:14px;border:1px solid var(--line);background:#fff;border-radius:12px;text-align:left;color:var(--ink)}.quick button:hover{border-color:#b6c8e9;background:#f8faff}.quick .qico{font-size:19px;margin-bottom:9px}.quick b{display:block;font-size:12px}.quick small{color:var(--muted);font-size:10px}.notice{padding:12px 14px;border-radius:10px;background:#fff8df;border:1px solid #f5e5a8;color:#765b0a;font-size:12px;margin-bottom:18px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:12px;font-weight:750;color:#405069}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #dbe2ec;border-radius:9px;outline:none;background:#fff;color:var(--ink)}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7da4f4;box-shadow:0 0 0 3px #eaf1ff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.formgrid .wide{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.filters{display:flex;gap:9px;flex-wrap:wrap;padding:15px 18px;border-bottom:1px solid var(--line)}.filters input,.filters select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:white;min-width:140px}.filters input{flex:1}.linkbox{word-break:break-all;background:#f5f8fd;padding:10px;border:1px dashed #c9d5e7;border-radius:8px;color:#31578f;font-size:12px}.fieldlist{display:grid;gap:8px}.fieldrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px}.fieldrow span{font-size:12px;font-weight:700}.fieldrow small{color:var(--muted)}.checkrow{display:flex;gap:8px;align-items:center;font-size:12px;color:#58677c;margin:8px 0}.checkrow input{accent-color:var(--blue)}.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:#102b52;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:99;max-width:calc(100vw - 40px)}.mobile-toggle{display:none}.form-public{max-width:620px;margin:35px auto;padding:24px}.publicbrand{display:flex;gap:12px;align-items:center;margin-bottom:20px}.publicbrand .logo{flex-shrink:0}.publicbrand h1{font-size:22px;margin:0}.publicbrand p{margin:3px 0 0;color:var(--muted)}.public-form{margin-top:22px}.public-form .field{margin-bottom:15px}.footnote{color:var(--muted);font-size:10px;margin-top:15px}.chart{height:165px;display:flex;align-items:flex-end;gap:9px;padding:12px 4px 0}.barwrap{height:100%;flex:1;display:flex;align-items:center;justify-content:flex-end;flex-direction:column;gap:7px}.bar{width:100%;max-width:35px;background:linear-gradient(180deg,#4d86f6,#2563eb);border-radius:6px 6px 2px 2px;min-height:3px}.barlabel{font-size:10px;color:#8792a3}.mini-row{display:flex;justify-content:space-between;gap:10px;margin:12px 0;font-size:12px}.progress{height:6px;background:#edf1f7;border-radius:10px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:var(--blue);border-radius:10px}.modal-backdrop{position:fixed;inset:0;background:#10233b77;display:grid;place-items:center;padding:18px;z-index:80}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 25px 80px #0003}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:17px}.modal-body{padding:22px}.close{border:0;background:#f1f4f8;border-radius:8px;width:31px;height:31px;font-size:18px}.campaign-link{font-size:11px;max-width:240px;overflow:hidden;text-overflow:ellipsis;color:#456baf}.footer{text-align:center;color:#99a4b4;font-size:10px;padding:26px 0 5px}
@media(max-width:1050px){.app{grid-template-columns:210px 1fr}.content{padding:22px 18px}.topbar{padding:0 18px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:70;inset:0 auto 0 0;width:250px;transform:translateX(-105%);transition:transform .2s;box-shadow:15px 0 40px #0002}.sidebar.open{transform:translateX(0)}.mobile-toggle{display:inline-flex}.topbar{height:62px;padding:0 14px}.content{padding:20px 13px}.pagehead{flex-direction:column}.pagehead h1{font-size:23px}.cards{gap:9px}.stat{padding:13px}.stat-num{font-size:24px}.stat-icon{width:30px;height:30px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.topright .pill{display:none}.panel-head{padding:14px}.panel-body{padding:14px}.filters{padding:12px}.filters input,.filters select{min-width:100px}.form-public{margin:12px auto;padding:18px}.quick{gap:8px}}
</style></head>
<body><div id="app"></div><div id="toast" class="toast hidden" role="status"></div><div id="modal-root"></div>
<script>
(()=>{'use strict';
const STORE='skillzax_prototype_v1';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);const now=()=>new Date().toISOString();const fmt=d=>d?new Date(d).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';const dateOnly=d=>d?new Date(d).toLocaleDateString():'';const qs=new URLSearchParams(location.search);
const initial={campaigns:[{id:'camp_choice',name:'Choice Demat',brand:'Choice',slug:'choice-demat',description:'Demat account acquisition campaign',destination:'https://rupeeko.vercel.app/?campid=demat-choice&subid=Asif_Choice&mode=form',status:'Active',fields:[{label:'Full Name',type:'text',required:true},{label:'Mobile Number',type:'tel',required:true}],createdAt:now(),views:128,submits:17,clicks:24},{id:'camp_upstox',name:'Upstox Web',brand:'Upstox',slug:'upstox-web',description:'Web campaign',destination:'',status:'Active',fields:[{label:'Full Name',type:'text',required:true},{label:'Mobile Number',type:'tel',required:true},{label:'Email Address',type:'email',required:false}],createdAt:now(),views:84,submits:9,clicks:15},{id:'camp_kotak',name:'Kotak 811',brand:'Kotak',slug:'kotak-811',description:'Bank account lead campaign',destination:'',status:'Paused',fields:[{label:'Full Name',type:'text',required:true},{label:'Mobile Number',type:'tel',required:true}],createdAt:now(),views:43,submits:5,clicks:8}],leads:[{id:id(),campaignId:'camp_choice',createdAt:now(),name:'Demo Lead',phone:'9000000000',email:'demo@example.com',subid:'Asif_Choice',utm_source:'demo',status:'New',source:'Sample',data:{'Full Name':'Demo Lead','Mobile Number':'9000000000','Email Address':'demo@example.com'}}],events:[],settings:{brand:'SkillzAx',owner:'Admin'}};
let db;try{db=JSON.parse(localStorage.getItem(STORE))||structuredClone(initial)}catch(e){db=structuredClone(initial)};let page='overview',editingId=null,leadSearch='',leadCampaign='all',leadStatus='all',campaignSearch='',eventFilter='all',fieldDraft=[],toastTimer;
function save(){localStorage.setItem(STORE,JSON.stringify(db))}function notify(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2800)}function record(type,campaignId,extra={}){db.events.unshift({id:id(),type,campaignId,at:now(),...extra});if(db.events.length>5000)db.events.length=5000;const c=db.campaigns.find(x=>x.id===campaignId);if(c){if(type==='page_view')c.views=(c.views||0)+1;if(type==='outbound_click')c.clicks=(c.clicks||0)+1}save()}
function campUrl(c){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('form',c.slug);return u.toString()}function getCampFromQuery(){const slug=qs.get('form');return db.campaigns.find(c=>c.slug===slug)||db.campaigns.find(c=>c.id===slug)}function appShell(content){$('#app').innerHTML=`<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">SA</div><div><strong>SkillzAx</strong><small>CAMPAIGN CONTROL CENTER</small></div></div><div class="nav-label">WORKSPACE</div><nav class="nav">${[['overview','▦','Overview'],['campaigns','▤','Campaigns'],['builder','✚','Form Builder'],['leads','♙','Lead Database'],['tracking','⌁','Tracking & Analytics']].map(([k,i,t])=>`<button class="${page===k?'active':''}" data-page="${k}"><span class="ico">${i}</span>${t}</button>`).join('')}</nav><div class="nav-label">TOOLS</div><nav class="nav"><button data-action="export"><span class="ico">⇩</span>Export leads CSV</button><button data-action="backup"><span class="ico">▣</span>Backup data</button><button data-action="reset"><span class="ico">↻</span>Reset demo data</button></nav><div class="side-bottom"><b>Prototype mode</b>Data is stored in this browser only. Add a real database and authentication before production use.</div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-toggle" id="menu-toggle">☰</button><div class="crumb">Workspace / <b>${({overview:'Overview',campaigns:'Campaigns',builder:'Form Builder',leads:'Lead Database',tracking:'Tracking & Analytics'}[page]||page)}</b></div></div><div class="topright"><span class="pill">● Prototype environment</span><div class="avatar">SA</div></div></header><section class="content">${content}<div class="footer">SKILLZAX • MULTI-CAMPAIGN WORKSPACE • PROTOTYPE</div></section></main></div>`;bindShell()}
function bindShell(){$$('.nav [data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;editingId=null;render()});$$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));$('#menu-toggle')?.addEventListener('click',()=>$('#sidebar').classList.toggle('open'));}
function $$(s){return [...document.querySelectorAll(s)]}function heading(eyebrow,title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}function stat(label,value,icon,note){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-num">${value}</div><div class="stat-note">${note}</div></div>`}function statusTag(s){return `<span class="tag ${s==='Active'?'green':s==='Paused'?'yellow':s==='Qualified'?'green':s==='Invalid'?'red':'gray'}">${esc(s||'New')}</span>`}
function overview(){const active=db.campaigns.filter(c=>c.status==='Active').length,leads=db.leads.length,views=db.campaigns.reduce((n,c)=>n+(c.views||0),0),clicks=db.campaigns.reduce((n,c)=>n+(c.clicks||0),0),subs=db.campaigns.reduce((n,c)=>n+(c.submits||0),0),rate=views?Math.round(subs/views*100):0;const recent=db.leads.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,5);return heading('OVERVIEW','Your campaigns, one place.','Monitor campaign performance, capture leads, and build new forms from one workspace.',`<button class="btn primary" data-action="new-campaign">＋ Create campaign</button>`)+`<div class="notice"><b>Prototype:</b> sample metrics are included to demonstrate the dashboard. Form submissions are saved to this browser only—not a shared online database.</div><div class="cards">${stat('Total campaigns',db.campaigns.length,'▤',active+' active campaigns')}${stat('Captured leads',leads,'♙','Stored in this browser')}${stat('Tracked page views',views.toLocaleString(),'◉','Across all campaigns')}${stat('Form conversion rate',rate+'%','↗',subs+' demo/recorded submissions')}</div><div class="grid2"><div class="panel"><div class="panel-head"><div><h3>Campaign performance</h3><p>Overview by campaign</p></div><button class="btn small" data-page="campaigns">View all →</button></div><div class="table-wrap"><table><thead><tr><th>Campaign</th><th>Status</th><th>Views</th><th>Leads</th><th>Rate</th></tr></thead><tbody>${db.campaigns.length?db.campaigns.slice(0,6).map(c=>`<tr><td><div class="campaign-name">${esc(c.name)}</div><div class="muted">${esc(c.brand||'—')}</div></td><td>${statusTag(c.status)}</td><td>${c.views||0}</td><td>${c.submits||0}</td><td>${(c.views?Math.round((c.submits||0)/c.views*100):0)}%</td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">No campaigns yet.</div></td></tr>`}</tbody></table></div></div><div class="panel"><div class="panel-head"><div><h3>Quick actions</h3><p>Keep your workflow moving</p></div></div><div class="panel-body"><div class="quick"><button data-action="new-campaign"><div class="qico">✚</div><b>New campaign</b><small>Set up a campaign</small></button><button data-page="builder"><div class="qico">▣</div><b>Build a form</b><small>Choose form fields</small></button><button data-page="leads"><div class="qico">♙</div><b>View leads</b><small>Search and export</small></button><button data-page="tracking"><div class="qico">⌁</div><b>Tracking</b><small>Inspect events</small></button></div></div></div></div><div class="panel" style="margin-top:18px"><div class="panel-head"><div><h3>Latest leads</h3><p>Most recent form submissions</p></div><button class="btn small" data-page="leads">Open lead database →</button></div><div class="table-wrap"><table><thead><tr><th>Lead</th><th>Campaign</th><th>Sub-ID</th><th>Status</th><th>Received</th></tr></thead><tbody>${recent.length?recent.map(l=>`<tr><td><b>${esc(l.name||'—')}</b><div class="muted">${esc(l.phone||'')}</div></td><td>${esc(db.campaigns.find(c=>c.id===l.campaignId)?.name||'Deleted campaign')}</td><td>${esc(l.subid||'—')}</td><td>${statusTag(l.status)}</td><td>${fmt(l.createdAt)}</td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">No leads captured yet.</div></td></tr>`}</tbody></table></div></div>`}
function campaignsPage(){let list=db.campaigns.filter(c=>(c.name+' '+c.brand+' '+c.slug).toLowerCase().includes(campaignSearch.toLowerCase()));return heading('CAMPAIGN MANAGEMENT','All campaigns','Create reusable lead forms and unique tracking links for any advertiser.',`<button class="btn primary" data-action="new-campaign">＋ New campaign</button>`)+`<div class="panel"><div class="filters"><input id="campaign-search" placeholder="Search campaigns, brands, slug…" value="${esc(campaignSearch)}"><select id="campaign-status"><option value="all">All statuses</option><option>Active</option><option>Paused</option></select></div><div class="table-wrap"><table><thead><tr><th>Campaign</th><th>Status</th><th>Views</th><th>Clicks</th><th>Leads</th><th>Tracking link</th><th>Actions</th></tr></thead><tbody id="campaign-rows">${campaignRows(list)}</tbody></table></div></div>`}function campaignRows(list){return list.length?list.map(c=>`<tr><td><div class="campaign-name">${esc(c.name)}</div><div class="muted">${esc(c.brand||'')} · /${esc(c.slug)}</div></td><td>${statusTag(c.status)}</td><td>${c.views||0}</td><td>${c.clicks||0}</td><td>${c.submits||0}</td><td><button class="btn small" data-copy-link="${esc(c.id)}">Copy link</button></td><td><div style="display:flex;gap:5px"><button class="btn small" data-edit="${esc(c.id)}">Edit</button><button class="btn small" data-toggle="${esc(c.id)}">${c.status==='Active'?'Pause':'Activate'}</button><button class="btn small danger" data-delete="${esc(c.id)}">Delete</button></div></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty"><b>No campaigns found</b>Create a campaign to generate a reusable form and tracking link.</div></td></tr>`}
function builderPage(){const current=db.campaigns.find(c=>c.id===editingId);const c=current||{name:'',brand:'',slug:'',description:'',destination:'',status:'Active',fields:[{label:'Full Name',type:'text',required:true},{label:'Mobile Number',type:'tel',required:true}]};fieldDraft=JSON.parse(JSON.stringify(c.fields||[]));return heading('FORM BUILDER',current?'Edit campaign form':'Create a campaign form','Configure the public form, destination and tracking parameters. One form per campaign; create as many campaigns as you need.')+`<form id="campaign-form" class="grid2"><div class="panel"><div class="panel-head"><div><h3>Campaign details</h3><p>Basic info and post-submit behavior</p></div><span class="tag">STEP 1</span></div><div class="panel-body"><div class="formgrid"><div class="field"><label>Campaign name *</label><input name="name" required maxlength="70" placeholder="e.g. Choice Demat" value="${esc(c.name)}"></div><div class="field"><label>Advertiser / brand</label><input name="brand" maxlength="70" placeholder="e.g. Choice" value="${esc(c.brand)}"></div><div class="field"><label>Unique URL slug *</label><input name="slug" required pattern="[a-zA-Z0-9-]+" placeholder="choice-demat" value="${esc(c.slug)}"><small class="muted">Letters, numbers and hyphens only.</small></div><div class="field"><label>Campaign status</label><select name="status"><option ${c.status==='Active'?'selected':''}>Active</option><option ${c.status==='Paused'?'selected':''}>Paused</option></select></div><div class="field wide"><label>Description</label><textarea name="description" rows="2" placeholder="Internal notes about this campaign">${esc(c.description)}</textarea></div><div class="field wide"><label>Official destination URL (optional)</label><input name="destination" type="url" placeholder="https://partner.example/offer" value="${esc(c.destination)}"><small class="muted">Users are redirected here after submission only if configured. Use an approved partner URL.</small></div></div><div class="actions"><button class="btn primary" type="submit">${current?'Save changes':'Create campaign'}</button><button class="btn" type="button" data-action="clear-builder">Clear</button></div></div></div><div class="panel"><div class="panel-head"><div><h3>Form fields</h3><p>Add the information you actually need</p></div><span class="tag">STEP 2</span></div><div class="panel-body"><div class="field"><label>Add a field</label><div style="display:flex;gap:8px"><select id="new-field-type"><option value="text">Full name / text</option><option value="tel">Mobile number</option><option value="email">Email address</option><option value="number">Number</option><option value="select">Dropdown</option></select><button class="btn" type="button" id="add-field">＋ Add</button></div></div><div id="field-list" class="fieldlist">${renderFieldDraft()}</div><div class="notice" style="margin-top:16px;margin-bottom:0">Only collect necessary data. Never ask customers to submit passwords, OTPs, PINs or full banking credentials.</div></div></div></form><div id="builder-result"></div>`}
function renderFieldDraft(){return fieldDraft.map((f,i)=>`<div class="fieldrow"><div><span>${esc(f.label)}</span><br><small>${esc(f.type)} · ${f.required?'Required':'Optional'}</small></div><div style="display:flex;gap:5px"><button class="btn small" type="button" data-field-edit="${i}">Edit</button><button class="btn small danger" type="button" data-field-remove="${i}">×</button></div></div>`).join('')||'<div class="empty">No fields yet. Add at least one field.</div>'}
function leadsPage(){let rows=db.leads.filter(l=>(!leadSearch||(Object.values(l.data||{}).join(' ')+l.name+' '+l.phone+' '+l.email+' '+l.subid).toLowerCase().includes(leadSearch.toLowerCase()))&&(leadCampaign==='all'||l.campaignId===leadCampaign)&&(leadStatus==='all'||l.status===leadStatus));rows.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return heading('LEAD MANAGEMENT','Lead database','Search, review, update status, and export campaign leads.',`<button class="btn primary" data-action="export">⇩ Export CSV</button>`)+`<div class="panel"><div class="filters"><input id="lead-search" placeholder="Search name, phone, email, sub-ID…" value="${esc(leadSearch)}"><select id="lead-campaign"><option value="all">All campaigns</option>${db.campaigns.map(c=>`<option value="${esc(c.id)}" ${leadCampaign===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select id="lead-status"><option value="all">All statuses</option>${['New','Contacted','Qualified','Invalid','Converted'].map(s=>`<option ${leadStatus===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="table-wrap"><table><thead><tr><th>Lead details</th><th>Campaign / sub-ID</th><th>Source</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody>${rows.length?rows.map(l=>`<tr><td><b>${esc(l.name||'—')}</b><div class="muted">${esc(l.phone||'')} ${l.email?'· '+esc(l.email):''}</div></td><td>${esc(db.campaigns.find(c=>c.id===l.campaignId)?.name||'Deleted campaign')}<div class="muted">${esc(l.subid||'—')}</div></td><td>${esc(l.source||'Direct')}</td><td><select data-lead-status="${esc(l.id)}" style="border:1px solid var(--line);border-radius:7px;padding:5px;font-size:11px">${['New','Contacted','Qualified','Invalid','Converted'].map(s=>`<option ${l.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td>${fmt(l.createdAt)}</td><td><button class="btn small" data-lead-view="${esc(l.id)}">View</button> <button class="btn small danger" data-lead-delete="${esc(l.id)}">Delete</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty"><b>No leads match</b>Submissions from campaign forms will appear here.</div></td></tr>`}</tbody></table></div><div class="panel-head"><span class="muted">${rows.length} lead(s) shown</span><button class="btn small" data-action="export">Export filtered data</button></div></div>`}
function trackingPage(){const events=db.events.filter(e=>eventFilter==='all'||e.type===eventFilter).slice(0,200);const totalViews=db.campaigns.reduce((a,c)=>a+(c.views||0),0),totalClicks=db.campaigns.reduce((a,c)=>a+(c.clicks||0),0),totalLeads=db.leads.length;return heading('MEASUREMENT','Tracking & analytics','Monitor page views, form submissions, outbound clicks, and URL attribution.')+`<div class="notice"><b>Attribution:</b> campid, subid, utm_source, utm_medium, utm_campaign and click IDs are captured when a public form is opened. A click or lead is not proof of a completed account opening; verified partner postback/API data is needed for that.</div><div class="cards">${stat('Page views',totalViews,'◉','Tracked form visits')}${stat('Outbound clicks',totalClicks,'↗','Partner destination clicks')}${stat('Leads',totalLeads,'♙','Saved form submissions')}${stat('Recent events',db.events.length,'⌁','Event log in this browser')}</div><div class="grid2"><div class="panel"><div class="panel-head"><div><h3>Lead volume by campaign</h3><p>Captured leads (including any demo rows)</p></div></div><div class="panel-body">${db.campaigns.length?db.campaigns.map(c=>{let n=db.leads.filter(l=>l.campaignId===c.id).length;let pct=Math.max(2,Math.round(n/Math.max(1,...db.campaigns.map(x=>db.leads.filter(l=>l.campaignId===x.id).length))*100));return `<div class="mini-row"><span>${esc(c.name)}</span><b>${n}</b></div><div class="progress"><i style="width:${pct}%"></i></div>`}).join(''):'No campaigns'}</div></div><div class="panel"><div class="panel-head"><div><h3>Event log</h3><p>Most recent activity</p></div><button class="btn small" data-action="clear-events">Clear log</button></div><div class="filters"><select id="event-filter"><option value="all">All events</option>${[['page_view','Page views'],['form_submit','Form submissions'],['outbound_click','Outbound clicks']].map(([v,l])=>`<option value="${v}" ${eventFilter===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="table-wrap"><table><thead><tr><th>Event</th><th>Campaign</th><th>Time</th></tr></thead><tbody>${events.length?events.map(e=>`<tr><td><span class="tag">${esc(e.type.replace('_',' '))}</span></td><td>${esc(db.campaigns.find(c=>c.id===e.campaignId)?.name||'—')}</td><td>${fmt(e.at)}</td></tr>`).join(''):`<tr><td colspan="3"><div class="empty">No events yet</div></td></tr>`}</tbody></table></div></div></div>`}
function render(){const publicCamp=getCampFromQuery();if(publicCamp){renderPublic(publicCamp);return}const views={overview,campaigns:campaignsPage,builder:builderPage,leads:leadsPage,tracking:trackingPage};appShell((views[page]||overview)());bindPage()}
function bindPage(){const form=$('#campaign-form');if(form){$('#add-field').onclick=()=>{const type=$('#new-field-type').value;const label=type==='tel'?'Mobile Number':type==='email'?'Email Address':type==='select'?'Choose an option':type==='number'?'Number':'New text field';fieldDraft.push({label,type,required:true});$('#field-list').innerHTML=renderFieldDraft();bindFieldDraft()};bindFieldDraft();form.onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));if(!fieldDraft.length)return notify('Add at least one form field.');let slug=data.slug.trim().toLowerCase();if(db.campaigns.some(c=>c.slug===slug&&c.id!==editingId))return notify('That URL slug is already in use.');const existing=db.campaigns.find(c=>c.id===editingId);const c={...(existing||{id:'camp_'+id(),createdAt:now(),views:0,clicks:0,submits:0}),...data,slug,fields:fieldDraft};if(existing)db.campaigns=db.campaigns.map(x=>x.id===editingId?c:x);else db.campaigns.unshift(c);save();editingId=c.id;notify(existing?'Campaign updated':'Campaign created');render();setTimeout(()=>{const target=$('#builder-result');if(target)target.innerHTML=`<div class="panel" style="margin-top:18px"><div class="panel-head"><div><h3>Campaign created successfully</h3><p>Copy this link to test your public form.</p></div><span class="tag green">READY TO TEST</span></div><div class="panel-body"><div class="linkbox">${esc(campUrl(c))}</div><div class="actions"><button class="btn primary" data-copy-link="${esc(c.id)}">Copy public form link</button><button class="btn" data-open-form="${esc(c.id)}">Preview form ↗</button></div></div></div>`;bindDynamicActions()},0)};}
if($('#campaign-search')){$('#campaign-search').oninput=e=>{campaignSearch=e.target.value;$('#campaign-rows').innerHTML=campaignRows(db.campaigns.filter(c=>(c.name+' '+c.brand+' '+c.slug).toLowerCase().includes(campaignSearch.toLowerCase())));bindDynamicActions()};$('#campaign-status').onchange=e=>{const s=e.target.value;$('#campaign-rows').innerHTML=campaignRows(db.campaigns.filter(c=>(c.name+' '+c.brand+' '+c.slug).toLowerCase().includes(campaignSearch.toLowerCase())&&(s==='all'||c.status===s)));bindDynamicActions()}}
if($('#lead-search'))$('#lead-search').oninput=e=>{leadSearch=e.target.value;rerenderLeads()};if($('#lead-campaign'))$('#lead-campaign').onchange=e=>{leadCampaign=e.target.value;rerenderLeads()};if($('#lead-status'))$('#lead-status').onchange=e=>{leadStatus=e.target.value;rerenderLeads()};if($('#event-filter'))$('#event-filter').onchange=e=>{eventFilter=e.target.value;render()};bindDynamicActions()}
function rerenderLeads(){const pos=$('#lead-search')?.selectionStart;render();const el=$('#lead-search');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
function bindFieldDraft(){$$('[data-field-remove]').forEach(b=>b.onclick=()=>{fieldDraft.splice(+b.dataset.fieldRemove,1);$('#field-list').innerHTML=renderFieldDraft();bindFieldDraft()});$$('[data-field-edit]').forEach(b=>b.onclick=()=>{const i=+b.dataset.fieldEdit,f=fieldDraft[i];openModal('Edit form field',`<div class="field"><label>Field label</label><input id="edit-field-label" value="${esc(f.label)}" maxlength="60"></div><div class="field"><label>Input type</label><select id="edit-field-type">${['text','tel','email','number','select'].map(t=>`<option ${f.type===t?'selected':''}>${t}</option>`).join('')}</select></div><label class="checkrow"><input type="checkbox" id="edit-field-required" ${f.required?'checked':''}> Required field</label><div class="actions"><button class="btn primary" id="save-field">Save field</button></div>`);$('#save-field').onclick=()=>{const label=$('#edit-field-label').value.trim();if(!label)return notify('Enter a field label.');fieldDraft[i]={label,type:$('#edit-field-type').value,required:$('#edit-field-required').checked};closeModal();$('#field-list').innerHTML=renderFieldDraft();bindFieldDraft()}})}
function bindDynamicActions(){$$('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;editingId=null;render()});$$('[data-copy-link]').forEach(b=>b.onclick=()=>copyText(campUrl(db.campaigns.find(c=>c.id===b.dataset.copyLink))));$$('[data-open-form]').forEach(b=>b.onclick=()=>window.open(campUrl(db.campaigns.find(c=>c.id===b.dataset.openForm)),'_blank','noopener'));$$('[data-edit]').forEach(b=>b.onclick=()=>{editingId=b.dataset.edit;page='builder';render()});$$('[data-toggle]').forEach(b=>b.onclick=()=>{const c=db.campaigns.find(x=>x.id===b.dataset.toggle);if(c){c.status=c.status==='Active'?'Paused':'Active';save();render();notify('Campaign status updated')}});$$('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this campaign? Existing leads will remain, but links will stop working.')){db.campaigns=db.campaigns.filter(c=>c.id!==b.dataset.delete);save();render();notify('Campaign deleted')}});$$('[data-lead-status]').forEach(s=>s.onchange=()=>{const l=db.leads.find(x=>x.id===s.dataset.leadStatus);if(l){l.status=s.value;save();notify('Lead status updated')}});$$('[data-lead-view]').forEach(b=>b.onclick=()=>{const l=db.leads.find(x=>x.id===b.dataset.leadView);openModal('Lead details',`<div class="formgrid">${Object.entries(l.data||{}).map(([k,v])=>`<div class="field"><label>${esc(k)}</label><div class="linkbox">${esc(v)}</div></div>`).join('')}<div class="field"><label>Campaign</label><div>${esc(db.campaigns.find(c=>c.id===l.campaignId)?.name||'Deleted campaign')}</div></div><div class="field"><label>Sub-ID</label><div>${esc(l.subid||'—')}</div></div><div class="field"><label>UTM source</label><div>${esc(l.utm_source||'—')}</div></div><div class="field"><label>Created</label><div>${fmt(l.createdAt)}</div></div></div>`)});$$('[data-lead-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this lead from this browser?')){db.leads=db.leads.filter(l=>l.id!==b.dataset.leadDelete);save();render();notify('Lead deleted')}})}
function action(a){if(a==='new-campaign'){editingId=null;page='builder';render();return}if(a==='clear-builder'){editingId=null;render();return}if(a==='export'){exportCSV();return}if(a==='backup'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});downloadBlob(blob,'skillzax-backup-'+dateOnly(now())+'.json');notify('Backup downloaded');return}if(a==='reset'){if(confirm('Reset this browser prototype to demo data? Your locally captured leads will be removed.')){db=structuredClone(initial);save();page='overview';editingId=null;render();notify('Demo data restored')}return}if(a==='clear-events'){if(confirm('Clear the event log?')){db.events=[];save();render();notify('Event log cleared')}}}
function exportCSV(){const headers=['lead_id','created_at','campaign','campaign_id','name','phone','email','subid','utm_source','utm_medium','utm_campaign','status','source','all_fields'];const rows=db.leads.filter(l=>(!leadSearch||(Object.values(l.data||{}).join(' ')+l.name+' '+l.phone+' '+l.email+' '+l.subid).toLowerCase().includes(leadSearch.toLowerCase()))&&(leadCampaign==='all'||l.campaignId===leadCampaign)&&(leadStatus==='all'||l.status===leadStatus));const csv=[headers,...rows.map(l=>[l.id,l.createdAt,db.campaigns.find(c=>c.id===l.campaignId)?.name||'',l.campaignId,l.name,l.phone,l.email,l.subid,l.utm_source,l.utm_medium,l.utm_campaign,l.status,l.source,JSON.stringify(l.data||{})])].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),'skillzax-leads-'+dateOnly(now())+'.csv');notify('CSV export downloaded')}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function copyText(text){try{await navigator.clipboard.writeText(text);notify('Copied to clipboard')}catch(e){openModal('Copy campaign link',`<div class="linkbox">${esc(text)}</div><p class="muted">Select and copy this URL.</p>`)}}
function openModal(title,body){$('#modal-root').innerHTML=`<div class="modal-backdrop" id="modal-backdrop"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" id="modal-close">×</button></div><div class="modal-body">${body}</div></div></div>`;$('#modal-close').onclick=closeModal;$('#modal-backdrop').onclick=e=>{if(e.target.id==='modal-backdrop')closeModal()}}function closeModal(){$('#modal-root').innerHTML=''}
function renderPublic(c){record('page_view',c.id);const params=new URLSearchParams(location.search);const extra=['campid','subid','utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid'];const attribution={};extra.forEach(k=>{if(params.has(k))attribution[k]=params.get(k)});appShellPublic(c,attribution)}function appShellPublic(c,attribution){$('#app').innerHTML=`<div style="min-height:100vh;padding:1px 15px 35px;background:linear-gradient(180deg,#edf3ff,#f7f9fc 320px)"><div class="form-public panel"><div class="publicbrand"><div class="logo">SA</div><div><h1>${esc(c.brand||c.name)}</h1><p>Powered by SkillzAx</p></div></div><div class="eyebrow">CAMPAIGN FORM</div><h2 style="font-size:24px;margin:7px 0">${esc(c.name)}</h2><p class="sub">${esc(c.description||'Please enter your details to continue.')}</p><form id="public-form" class="public-form">${(c.fields||[]).map((f,i)=>`<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label>${f.type==='select'?`<select name="field_${i}" ${f.required?'required':''}><option value="">Select an option</option>${(f.options||['Yes','No','Other']).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:`<input name="field_${i}" type="${['text','tel','email','number'].includes(f.type)?f.type:'text'}" placeholder="Enter ${esc(f.label.toLowerCase())}" ${f.required?'required':''} ${f.type==='tel'?'inputmode="tel"':''} maxlength="120">`}</div>`).join('')}<label class="checkrow"><input type="checkbox" required> I agree to be contacted about this request and understand my details will be handled according to the campaign's privacy notice.</label><button class="btn primary" style="width:100%;padding:13px" type="submit">Continue →</button><div class="footnote">Please provide accurate details. Do not enter passwords, OTPs, PINs or banking credentials. This demo form stores submissions only in this browser.</div></form></div></div>`;$('#public-form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),data={};(c.fields||[]).forEach((f,i)=>data[f.label]=String(fd.get('field_'+i)||'').trim());const name=Object.entries(data).find(([k])=>/name/i.test(k))?.[1]||'',phone=Object.entries(data).find(([k])=>/mobile|phone|number/i.test(k))?.[1]||'',email=Object.entries(data).find(([k])=>/email/i.test(k))?.[1]||'';const lead={id:id(),campaignId:c.id,createdAt:now(),name,phone,email,subid:attribution.subid||'',utm_source:attribution.utm_source||'',utm_medium:attribution.utm_medium||'',utm_campaign:attribution.utm_campaign||'',status:'New',source:document.referrer?'Referral':'Direct',data,attribution};db.leads.unshift(lead);c.submits=(c.submits||0)+1;record('form_submit',c.id,{leadId:lead.id,subid:lead.subid});save();const redirect=c.destination;$('#app').innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:20px;background:#f3f7fc"><div class="panel" style="max-width:480px;text-align:center;padding:35px 25px"><div class="stat-icon" style="margin:0 auto 15px;background:#e3f8ee;color:#138a62;font-size:25px">✓</div><h1 style="margin:0 0 8px">Details submitted</h1><p class="sub">Your demo lead was saved in this browser. For a real campaign, connect a secure shared database before collecting live leads.</p><div class="actions" style="justify-content:center"><button class="btn" onclick="location.href=location.pathname">Back to portal</button>${redirect?'<button class="btn primary" id="go-partner">Continue to partner ↗</button>':''}</div></div></div>`;$('#go-partner')?.addEventListener('click',()=>{record('outbound_click',c.id);window.location.href=redirect})}}
// Start app; direct form links are handled as public form pages, admin pages stay in dashboard.
const publicSlug=qs.get('form');if(publicSlug){const c=getCampFromQuery();if(c&&c.status==='Active')renderPublic(c);else{appShell(heading('FORM UNAVAILABLE','Campaign form unavailable','This form may be paused or the URL may be incorrect.')+`<button class="btn" onclick="location.href=location.pathname">Open dashboard</button>`)} }else render();
})();
</script></body></html>
